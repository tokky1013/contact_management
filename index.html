<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>コンタクト管理</title>
</head>
<body>
    <h2>コンタクト管理</h2>
    <div class="input-container">
        <div class="input-title">コンタクトの追加</div>
        <div class="item-container">
            <div>使用開始日</div>
            <input type="date">
        </div>
        <div class="item-container">
            <div>使用期間</div>
            <select name="" id="">
                <option value="1">1day</option>
                <option value="14" selected>2week</option>
                <option value="30">1month</option>
            </select>
        </div>
        <button class="add-btn">追加</button>
    </div>
    <table>
        <tr>
            <th>使用開始日</th>
            <th>使用期間</th>
        </tr>
        <tr class="is-valid">
            <td>2026/11/22</td>
            <td>1day</td>
        </tr>
        <tr class="is-due-today">
            <td>2025/1/1</td>
            <td>2week</td>
        </tr>
        <tr class="is-expired">
            <td>2024/11/2</td>
            <td>1month</td>
        </tr>
    </table>
</body>
</html>
